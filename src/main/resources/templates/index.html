<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To-Do List</title>
    <meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script th:src="@{/theme.js}"></script>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="user">
                <img th:if="${userPicture}" th:src="${userPicture}" alt="" referrerpolicy="no-referrer">
                <span th:text="${userName}">User</span>
            </div>
            <div class="right">
                <label class="switch" title="Dark mode">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
                <div class="planner">
    <button type="button" id="planToggle" class="btn-ai">🗓️ Schedule with AI</button>

    <div id="planBox" class="plan-box" hidden>
        <textarea id="ideaInput" rows="3" maxlength="500"
            placeholder="Tell me your plans... e.g. learn Spring Boot course 2 hours, go out with friends, gym"></textarea>
        <div class="plan-actions">
            <button type="button" id="planBtn" class="btn-ai">Generate schedule</button>
            <button type="button" id="planCancel" class="btn-cancel">Cancel</button>
        </div>
    </div>
    <span id="planMsg"></span>
</div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>

        <h1>My To-Do List</h1>

        <form th:action="@{/add}" method="post" class="add-form">
            <input type="text" name="title" placeholder="Enter a task..." required>
            <button type="submit">Add</button>
        </form>
        <div class="ai-bar">
    <button type="button" id="aiBtn" class="btn-ai">✨ Prioritize</button>
    <span id="aiMsg"></span>
</div>

        <form id="bulkForm" th:action="@{/delete-selected}" method="post"
      onsubmit="return confirm('Delete the selected tasks?');"></form>

<div class="bulk-bar" th:if="${!#lists.isEmpty(tasks)}">
    <label class="select-all">
        <input type="checkbox" id="selectAll"> Select all
    </label>
    <button type="submit" form="bulkForm" id="delSelected" class="btn-delete" disabled>
        Delete selected
    </button>
    <form th:action="@{/delete-all}" method="post"
          onsubmit="return confirm('Delete ALL tasks? This cannot be undone.');">
        <button type="submit" class="btn-delete">Delete all</button>
    </form>
</div>

<ul>
    <li th:each="task : ${tasks}" th:attr="data-id=${task.id}">
        <div class="task-main">
            <input type="checkbox" class="sel" name="ids" th:value="${task.id}" form="bulkForm">
            <span class="time" th:if="${task.scheduledTime}" th:text="${task.scheduledTime}"></span>
            <span th:text="${task.title}"
                  th:classappend="${task.completed} ? 'done' : ''"></span>
        </div>

        <div class="actions">
            <form th:action="@{/toggle/{id}(id=${task.id})}" method="post">
                <button type="submit" class="btn-done">
                    <span th:text="${task.completed} ? 'Undo' : 'Done'"></span>
                </button>
            </form>
            <form th:action="@{/delete/{id}(id=${task.id})}" method="post">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </div>
    </li>
</ul>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
    <script>
    const aiBtn = document.getElementById("aiBtn");
    const aiMsg = document.getElementById("aiMsg");

    aiBtn.addEventListener("click", async () => {
        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;

        aiBtn.disabled = true;
        aiBtn.textContent = "Thinking...";
        aiMsg.textContent = "";

        try {
            const res = await fetch("/api/ai/prioritize", {
                method: "POST",
                headers: { [header]: token }
            });
            const data = await res.json();
            if (!res.ok) {
                aiMsg.textContent = data.error || "Something went wrong.";
                return;
            }
            const list = document.querySelector("ul");
            // prepend in reverse so the AI's order ends up on top
            [...data].reverse().forEach(t => {
                const li = list.querySelector('li[data-id="' + t.id + '"]');
                if (li) list.prepend(li);
            });
            aiMsg.textContent = "Sorted by AI ✨";
        } catch (e) {
            aiMsg.textContent = "Network error. Try again.";
        } finally {
            aiBtn.disabled = false;
            aiBtn.textContent = "✨ Prioritize";
        }
    });
</script>
    <script>
    // ---- AI planner: input hidden until the button is clicked ----
    const planToggle = document.getElementById("planToggle");
    const planBox = document.getElementById("planBox");
    const planBtn = document.getElementById("planBtn");
    const planCancel = document.getElementById("planCancel");
    const planMsg = document.getElementById("planMsg");
    const ideaInput = document.getElementById("ideaInput");

    planToggle.addEventListener("click", () => {
        planBox.hidden = false;
        planToggle.hidden = true;
        ideaInput.focus();
    });

    planCancel.addEventListener("click", () => {
        planBox.hidden = true;
        planToggle.hidden = false;
        ideaInput.value = "";
        planMsg.textContent = "";
    });

    planBtn.addEventListener("click", async () => {
        const idea = ideaInput.value.trim();
        if (!idea) { planMsg.textContent = "Type your plans first."; return; }

        const token = document.querySelector('meta[name="_csrf"]').content;
        const header = document.querySelector('meta[name="_csrf_header"]').content;
        const d = new Date();
        const now = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");

        planBtn.disabled = true;
        planBtn.textContent = "Planning...";
        planMsg.textContent = "";

        try {
            const res = await fetch("/api/ai/schedule", {
                method: "POST",
                headers: { [header]: token, "Content-Type": "application/json" },
                body: JSON.stringify({ idea, now })
            });
            const data = await res.json();
            if (!res.ok) { planMsg.textContent = data.error || "Something went wrong."; return; }
            location.reload();
        } catch (e) {
            planMsg.textContent = "Network error. Try again.";
        } finally {
            planBtn.disabled = false;
            planBtn.textContent = "Generate schedule";
        }
    });
</script>

<script>
    // ---- Selection for bulk delete ----
    const selectAll = document.getElementById("selectAll");
    const delSelected = document.getElementById("delSelected");
    const boxes = () => [...document.querySelectorAll(".sel")];

    function refreshSelection() {
        const all = boxes();
        const checked = all.filter(b => b.checked).length;
        if (delSelected) {
            delSelected.disabled = checked === 0;
            delSelected.textContent = checked ? "Delete selected (" + checked + ")" : "Delete selected";
        }
        if (selectAll) selectAll.checked = all.length > 0 && checked === all.length;
    }

    if (selectAll) {
        selectAll.addEventListener("change", () => {
            boxes().forEach(b => b.checked = selectAll.checked);
            refreshSelection();
        });
    }
    boxes().forEach(b => b.addEventListener("change", refreshSelection));
</script>
</body>
</html>
