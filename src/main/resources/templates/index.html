<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My To-Do List</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script th:src="@{/theme.js}"></script>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="user">
                <img th:if="${userPicture}" th:src="${userPicture}" alt="" referrerpolicy="no-referrer">
                <span th:text="${userName}">User</span>
            </div>
            <div class="right">
                <label class="switch" title="Dark mode">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider"></span>
                </label>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">Logout</button>
                </form>
            </div>
        </div>

        <h1>My To-Do List</h1>

        <form th:action="@{/add}" method="post" class="add-form">
            <input type="text" name="title" placeholder="Enter a task..." required>
            <button type="submit">Add</button>
        </form>

        <ul>
            <li th:each="task : ${tasks}">
                <span th:text="${task.title}"
                      th:classappend="${task.completed} ? 'done' : ''"></span>

                <div class="actions">
                    <form th:action="@{/toggle/{id}(id=${task.id})}" method="post">
                        <button type="submit" class="btn-done">
                            <span th:text="${task.completed} ? 'Undo' : 'Done'"></span>
                        </button>
                    </form>
                    <form th:action="@{/delete/{id}(id=${task.id})}" method="post">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }
    </script>
</body>
</html>
