<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My To-Do List</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <form th:action="@{/add}" method="post" class="add-form">
            <input type="text" name="title" placeholder="Enter a task..." required>
            <button type="submit">Add</button>
        </form>

        <ul>
            <li th:each="task : ${tasks}">
                <span th:text="${task.title}"
                      th:classappend="${task.completed} ? 'done' : ''"></span>

                <div class="actions">
                    <form th:action="@{/toggle/{id}(id=${task.id})}" method="post">
                        <button type="submit" class="btn-done">
                            <span th:text="${task.completed} ? 'Undo' : 'Done'"></span>
                        </button>
                    </form>
                    <form th:action="@{/delete/{id}(id=${task.id})}" method="post">
                        <button type="submit" class="btn-delete">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
