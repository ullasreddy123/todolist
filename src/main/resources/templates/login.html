<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">
</head>
<body>
    <div class="container login-box">
        <h1>My To-Do List</h1>
        <p>Sign in to see and manage your own tasks.</p>

        <a class="google-btn" th:href="@{/oauth2/authorization/google}">
            Continue with Google
        </a>

        <p class="error" th:if="${param.error}">Sign-in failed. Please try again.</p>
    </div>
    <button id="aiBtn">✨ Suggest priority order</button>
<ol id="aiResult"></ol>
<p id="aiError" style="color:red"></p>

<script>
document.getElementById('aiBtn').addEventListener('click', async () => {
  const btn = document.getElementById('aiBtn');
  const list = document.getElementById('aiResult');
  const err = document.getElementById('aiError');
  list.innerHTML = ''; err.textContent = '';
  btn.disabled = true; btn.textContent = 'Thinking...';

  try {
    const res = await fetch('/api/ai/prioritize', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error; return; }
    data.forEach(t => {
      const li = document.createElement('li');
      li.textContent = t.title;   // textContent, not innerHTML, to avoid XSS
      list.appendChild(li);
    });
  } catch (e) {
    err.textContent = 'Something went wrong.';
  } finally {
    btn.disabled = false; btn.textContent = '✨ Suggest priority order';
  }
});
</script>
</body>
</html>
